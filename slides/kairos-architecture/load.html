<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>O sistema já mede o caminho crítico</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    .slide-container { position: relative; width: 1280px; min-height: 720px; background: #e5e7eb; color: #1c1917; padding-top: 76px; overflow: hidden; }
    .wrap { margin: 0 102px; }
    .topline { display: flex; justify-content: space-between; border-top: 2px solid #059669; padding-top: 15px; }
    .index, .series { color: #059669; font: 700 14px/1 Arial, sans-serif; letter-spacing: .14em; }
    .series { color: #78716c; }
    .intro { padding-top: 44px; }
    h1 { margin: 0; font: 700 52px/1.03 Georgia, 'Times New Roman', serif; letter-spacing: -.04em; }
    .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding-top: 50px; align-items: center; }
    .metrics-container { position: relative; padding: 48px 40px; border-left: 8px solid #059669; }
    .metrics-container::before { content: ''; position: absolute; inset: 0; background: #059669; opacity: 0.1; z-index: 0; }
    .metrics-grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 48px 32px; }
    .metric-value { font: 700 56px/1 Georgia, 'Times New Roman', serif; color: #1c1917; margin-bottom: 12px; letter-spacing: -.02em; }
    .metric-label { font: 400 18px/1.4 Arial, sans-serif; color: #44403c; }
    .visual { display: flex; align-items: center; justify-content: center; }
    .visual img { width: 100%; height: 380px; object-fit: cover; border: 1px solid #a8a29e; mix-blend-mode: multiply; }
    .foot { position: absolute; left: 102px; right: 102px; bottom: 40px; display: flex; justify-content: space-between; color: #78716c; font: 700 11px/1 Arial, sans-serif; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="wrap">
      <div class="topline"><span class="index">08 / PERFORMANCE</span><span class="series">TESTE DE CARGA · WAV</span></div>
      <div class="intro">
        <h1>O sistema já mede o caminho crítico</h1>
      </div>
      <div class="main-content">
        <div class="metrics-container">
          <div class="metrics-grid">
            <div class="metric-item">
              <div class="metric-value">20/20</div>
              <div class="metric-label">Tarefas concluídas<br>(100% de sucesso)</div>
            </div>
            <div class="metric-item">
              <div class="metric-value">36,9</div>
              <div class="metric-label">Tarefas por segundo<br>(Throughput)</div>
            </div>
            <div class="metric-item">
              <div class="metric-value">71,3 ms</div>
              <div class="metric-label">Latência fim a fim<br>(P50)</div>
            </div>
            <div class="metric-item">
              <div class="metric-value">78,8 ms</div>
              <div class="metric-label">Latência fim a fim<br>(P95)</div>
            </div>
          </div>
        </div>
        <div class="visual">
          <img src="/home/ubuntu/KAIR-S-SONICA/assets/references/frequency-analysis.png" alt="Gráficos de domínio de frequência e ativação de sinal" />
        </div>
      </div>
    </div>
    <div class="foot"><span>20 TAREFAS · CONCORRÊNCIA 5 · REFERÊNCIA WAV</span><span>08</span></div>
  </div>
</body>
</html>
