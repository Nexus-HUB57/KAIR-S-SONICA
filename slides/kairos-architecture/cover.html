<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>KAIR-S-SONICA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .slide-container { position: relative; width: 1280px; min-height: 720px; background: #e5e7eb; color: #1c1917; overflow: hidden; }
    .frame { display: grid; grid-template-columns: 1.08fr .92fr; min-height: 720px; margin: 0 92px; padding-top: 84px; }
    .copy { position: relative; z-index: 2; padding-top: 72px; }
    .eyebrow { margin: 0 0 26px; color: #059669; font: 700 16px/1.2 Arial, sans-serif; letter-spacing: .18em; }
    h1 { max-width: 650px; margin: 0; font: 700 76px/.94 Georgia, 'Times New Roman', serif; letter-spacing: -.045em; }
    .subtitle { max-width: 510px; margin: 30px 0 0; color: #44403c; font: 400 24px/1.35 Arial, sans-serif; }
    .credit { margin-top: 60px; color: #78716c; font: 400 15px/1.4 Arial, sans-serif; }
    .portrait-wrap { position: relative; display: flex; align-items: center; justify-content: center; min-height: 520px; }
    .portrait-wrap::before { content: ''; position: absolute; width: 350px; height: 480px; border: 1px solid rgba(5,150,105,.45); transform: rotate(8deg); }
    .portrait-wrap::after { content: ''; position: absolute; top: 60px; right: 12px; width: 110px; height: 110px; background: rgba(5,150,105,.11); transform: rotate(45deg); }
    .portrait { position: relative; z-index: 1; width: 320px; height: 460px; object-fit: contain; }
    .line { position: absolute; left: 0; bottom: 52px; width: 210px; height: 2px; background: #059669; }
    .line-label { position: absolute; left: 226px; bottom: 44px; color: #059669; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .12em; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="frame">
      <section class="copy">
        <p class="eyebrow">AGENTE KÁIROS · CENTRAL MULTIMÍDIA</p>
        <h1>KAIR-S-SONICA</h1>
        <p class="subtitle">Arquitetura da central multimídia do Agente Káiros</p>
        <p class="credit">Manus AI · Agosto de 2026</p>
      </section>
      <div class="portrait-wrap">
        <img class="portrait" src="/home/ubuntu/KAIR-S-SONICA/assets/persona/kairos-persona.png" alt="Persona Káiros, inteligência sintética de orquestração multimídia" />
      </div>
    </div>
    <span class="line"></span><span class="line-label">ARQUITETURA · 01</span>
  </div>
</body>
</html>
