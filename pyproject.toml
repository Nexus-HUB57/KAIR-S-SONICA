[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-sonica"
version = "0.1.0"
description = "Orquestrador modular de áudio generativo, DSP e entrega em streaming."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "KAIR-S-SONICA contributors" }]
dependencies = [
  "fastapi>=0.100",
  "numpy>=1.24",
  "pydantic>=2.4",
  "uvicorn[standard]>=0.23",
]

[project.optional-dependencies]
audio = [
  "librosa>=0.10",
  "pedalboard>=0.9",
  "pydub>=0.25",
  "soundfile>=0.12",
  "essentia>=2.3.3",
]
transcription = [
  "faster-whisper>=1.0",
]
multimedia = [
  "librosa>=0.10",
  "pedalboard>=0.9",
  "pydub>=0.25",
  "soundfile>=0.12",
  "faster-whisper>=1.0",
]
ml = [
  "torch>=2.1",
  "torchaudio>=2.1",
  "transformers>=4.35",
]
separation = ["demucs>=4.0"]
dev = ["httpx>=0.24", "pytest>=7.4", "ruff>=0.6"]

[project.scripts]
kairos = "kairos_core.cli:main"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = [".", "packages"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
