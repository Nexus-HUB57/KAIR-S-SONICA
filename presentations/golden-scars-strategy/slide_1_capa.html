<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Space+Mono:wght@500&display=swap');
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #121212;
            color: #E8E9EB;
            font-family: 'Space Mono', monospace;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .left-panel {
            width: 60%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 2px dashed #C5A059;
            z-index: 2;
        }

        .right-panel {
            width: 40%;
            position: relative;
            background: #000;
        }

        .hero-image {
            width: 100%;
            height: 720px;
            object-fit: cover;
            opacity: 0.8;
        }

        .brand-label {
            color: #C5A059;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #C5A059;
            display: inline-block;
            padding-bottom: 5px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 900;
            font-size: 120px;
            line-height: 0.9;
            color: #C5A059;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .subtitle {
            font-size: 32px;
            color: #E8E9EB;
            margin-bottom: 60px;
            max-width: 500px;
        }

        .quote-box {
            border-left: 4px solid #8B261A;
            padding-left: 20px;
            font-style: italic;
            color: #C5A059;
            font-size: 20px;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(197, 160, 89, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(197, 160, 89, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-overlay"></div>
        <div class="left-panel">
            <div class="brand-label">KAIR-S-SONICA / PROJETO KTD</div>
            <h1>GOLDEN<br>SCARS</h1>
            <div class="subtitle">Plano Estratégico de Lançamento e Marketing</div>
            <div class="quote-box">
                "They want the shine, not the scars — I bring both."
            </div>
        </div>
        <div class="right-panel">
            <img src="/home/ubuntu/KAIR-S-SONICA/assets/images/golden-scars-lyric-card-01.png" alt="KTD Portrait" class="hero-image">
        </div>
    </div>
</body>
</html>
