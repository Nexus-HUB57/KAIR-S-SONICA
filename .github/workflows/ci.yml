name: CI

on:
  push:
    branches: [main, 'integration/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python package and dev tools
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Compile Python modules
        run: PYTHONPATH=packages python -m compileall -q packages services tests scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - name: Build web client
        run: npm ci --prefix web-client && npm run build --prefix web-client
