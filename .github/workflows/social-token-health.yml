name: Social · token health

"on":
  workflow_dispatch:
  schedule:
    - cron: "23 05 * * *"

permissions:
  contents: read

concurrency:
  group: ktd-social-token-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production-social
    timeout-minutes: 10
    env:
      KTD_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.KTD_INSTAGRAM_ACCESS_TOKEN }}
      KTD_TIKTOK_ACCESS_TOKEN: ${{ secrets.KTD_TIKTOK_ACCESS_TOKEN }}
      KTD_INSTAGRAM_EXPECTED_USERNAME: khairusktd_ofc
      KTD_SOCIAL_HEALTH_PLATFORMS: instagram,tiktok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate provider tokens without publishing
        run: python scripts/social_token_health.py
